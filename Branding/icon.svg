<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.55" stop-color="#FF5B3A"/>
      <stop offset="1" stop-color="#E8344E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A1020" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A1A1A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle macOS (grille 1024, forme 824) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" ry="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
  <!-- Viseur : quatre coins (le symbole de Déclic) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M300 420 V340 Q300 300 340 300 H420"/>
    <path d="M604 300 H684 Q724 300 724 340 V420"/>
    <path d="M724 604 V684 Q724 724 684 724 H604"/>
    <path d="M420 724 H340 Q300 724 300 684 V604"/>
