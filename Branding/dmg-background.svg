<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF3EC"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="382" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8344E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FF5B3A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF5B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="680" height="400" fill="url(#bg)"/>
  <rect width="680" height="400" fill="url(#glow)"/>
  <!-- Arrow from the app (left) to Applications (right) -->
  <g fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
